id: PHASE-4
goal: "The other four activity types and groups: polls, topic selection, topic proposals with approval, slot booking, group activities"
depends_on: [PHASE-3]
use_cases: [UC-019, UC-013, UC-014, UC-015, UC-027, UC-016, UC-040]
entities: [ENT-Group, ENT-GroupMembership, ENT-Poll, ENT-PollOption, ENT-PollParticipation, ENT-PollVote, ENT-TopicActivity, ENT-Topic, ENT-TopicChoice, ENT-TopicProposal, ENT-SlotActivity, ENT-Slot, ENT-Booking]
components: [CMP-Courses, CMP-Activities, CMP-Assessment, CMP-Notifications, CMP-Audit]
decisions: [SCOPE-011, SCOPE-012, SCOPE-013, SCOPE-017, SCOPE-025, SCOPE-026, SCOPE-028, SCOPE-029, SEC-009, DATA-006]
environment: development
out_of_scope:
  - "Live quizzes (PHASE-5)"
  - "XP and badges (PHASE-6)"
  - "Analytics (PHASE-7)"
tasks:
  - id: P4-T1
    title: Groups
    description: "Groups per SCOPE-025: owner, invitations with withdraw and re-invitation rows, soft delete on dissolve or when empty, membership cleanup when an enrolment is deleted (removal and archiving), read-only views for the owning teacher and org admins, GroupInvitationCreated and GroupMembershipChanged events"
    use_cases: [UC-019]
    touches: {writes: [CMP-Courses], migrations: true}
  - id: P4-T2
    title: Polls
    description: "Polls per SCOPE-013, SEC-009 and SCOPE-026: wizard settings and options with limits and defaults, voting, results visibility, closing at deadline or close, edit lock after the first vote, no submissions overview. Scope is ENT-Poll, ENT-PollOption, ENT-PollParticipation and ENT-PollVote only: the OWN-008, OWN-009 and OWN-010 criteria and the ENT-TopicProposal state criteria that appear in this brief belong to P4-T3, P4-T4 and P4-T5 and are NOT verified here"
    use_cases: [UC-013]
    entities: [ENT-Poll, ENT-PollOption, ENT-PollParticipation, ENT-PollVote]
    touches: {writes: [CMP-Activities], migrations: true}
  - id: P4-T3
    title: Topic selection
    depends_on: [P4-T1, P4-T2]
    use_cases: [UC-014]
    acceptance_criteria:
      - "Given student X in groups G1 and G2 of the space, When X chooses a topic in a group topic activity, Then X picks which group acts and the choice belongs to that group (SCOPE-025)"
      - "Given G1 holds a choice in activity A and X is a member of G1 and G2, When G2 tries to choose a topic in A, Then it is refused"
      - "Given a group with more current members than A's group_size, When it tries to choose in A, Then it is refused"
    touches: {writes: [CMP-Activities], reads: [CMP-Courses], migrations: true}
  - id: P4-T4
    title: Topic proposals and approval
    depends_on: [P4-T3]
    use_cases: [UC-015, UC-027]
    acceptance_criteria:
      - "Given X takes part in a group activity through G1, When X proposes a topic in it for G2, Then it is refused (SCOPE-025)"
    touches: {writes: [CMP-Activities], reads: [CMP-Courses], migrations: true}
  - id: P4-T5
    title: Slot booking
    depends_on: [P4-T1, P4-T4]
    use_cases: [UC-016]
    acceptance_criteria:
      - "Given X in groups G1 and G2, When X books a slot in a group slot activity, Then X picks which group books (SCOPE-025)"
      - "Given G1 holds a booking in activity A and X is a member of G1 and G2, When G2 tries to book in A, Then it is refused"
    touches: {writes: [CMP-Activities], reads: [CMP-Courses], migrations: true}
  - id: P4-T6
    title: Group quiz attempts
    description: "One member submits for the group; all members see the attempt and get the same grade (SCOPE-012)"
    depends_on: [P4-T1]
    acceptance_criteria:
      - "Given X in groups G1 and G2, When X starts a group quiz attempt, Then X picks which group the attempt belongs to (SCOPE-025)"
      - "Given G1 has an attempt in quiz Q and X is a member of G1 and G2, When G2 tries to start an attempt in Q, Then it is refused"
      - "Given X was a member of G when G's attempt was submitted and graded, When X later leaves G or G is deleted, Then X still sees the attempt and its grade (OWN-006)"
      - "Given Y joined G after G's attempt was submitted and later left, When Y requests that attempt, Then it is refused"
    touches: {writes: [CMP-Assessment], reads: [CMP-Courses], migrations: true}
  - id: P4-T7
    title: Notifications for topic decisions and group invitations
    description: "The group invitation notification listens to GroupInvitationCreated(organizationId, groupMembershipId) from Courses (SCOPE-025)"
    depends_on: [P4-T1, P4-T4]
    touches: {writes: [CMP-Notifications], reads: [CMP-Activities, CMP-Courses]}
  - id: P4-T8
    title: Activity deletion
    description: "UC-040 per SCOPE-029: ActivityType gains hasSubmissions(Activity), implemented by every registered type (quiz in Assessment: any attempt; poll: any participation; topic selection: any choice; topic proposal: any proposal; slot booking: any current booking); DeleteActivity soft-deletes after the policy and that check, with a confirmation dialog; ActivityDeleted(organizationId, activityId, actorId, type) after commit; Audit listener writes action activity.deleted, actor_type user with actor_id = actorId, subject activity, changes {type}; one entry. Live sessions are added to the quiz check by P5-T2"
    depends_on: [P4-T2, P4-T3, P4-T4, P4-T5, P4-T6]
    use_cases: [UC-040]
    acceptance_criteria:
      - "Given an activity deleted by its teacher, Then exactly one audit entry activity.deleted with changes {type} exists"
    touches: {writes: [CMP-Activities, CMP-Assessment, CMP-Audit]}
