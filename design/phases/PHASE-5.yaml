id: PHASE-5
goal: "Live quiz end to end: lobby or scheduled start, common time window, live monitoring, reconnection, final ranking"
depends_on: [PHASE-4]
use_cases: [UC-024, UC-025]
entities: [ENT-Quiz, ENT-LiveSession, ENT-LiveParticipant, ENT-LiveAnswer]
components: [CMP-Live, CMP-Assessment]
decisions: [ARCH-009, SCOPE-010, SCOPE-014, SCOPE-019, SCOPE-021, SCOPE-022, SEC-005, SEC-008, SEC-010, ARCH-006, DATA-009, OPS-002]
environment: development
acceptance_criteria:
  - "A browser test with 50 simulated students shows each answer in the teacher's progress view within 1 second"
out_of_scope:
  - "XP awarding (PHASE-6 listens to LiveSessionFinished)"
  - "Per-question pacing, reveal, live leaderboard during the quiz, projector mode (SCOPE-021)"
tasks:
  - id: P5-T1
    title: Live mode in the wizard
    description: "Quiz mode live with start mode (manual or scheduled) and duration; refuse free-text questions in live quizzes"
    touches: {writes: [CMP-Assessment]}
  - id: P5-T2
    title: Live session engine
    description: "LiveSession state machine (lobby, cancelled, running, finished), scheduled start job, common end time, finish job, early finish when all submitted, scoring with partial credit, final ranks; LiveSessionFinished event; the quiz's hasSubmissions (SCOPE-029) also returns true once a live session of the quiz has started"
    depends_on: [P5-T1]
    acceptance_criteria:
      - "Given a live quiz whose session has started, When its teacher deletes the activity, Then it is refused (SCOPE-029)"
      - "Given a live quiz whose session is still in the lobby or was cancelled before starting and has no attempts, When its teacher deletes the activity, Then it is soft-deleted"
    touches: {writes: [CMP-Live], reads: [CMP-Assessment], migrations: true}
  - id: P5-T3
    title: Real-time channels and reconnection
    description: "Reverb presence and private channels authorised by policies, broadcast events, state snapshot endpoint, 2-second polling fallback"
    depends_on: [P5-T2]
    touches: {writes: [CMP-Live]}
  - id: P5-T4
    title: Teacher monitor UI
    description: "Monitor page; the optional ProvidesActivityActions contract in Activities rendered on the activity page; LiveQuizType implements it with the teacher's 'Open live quiz' link and with the self-paced 'Open quiz' link (key open_quiz, enrolled students, non-live quizzes only), which moves out of Activities/Show.vue; update tests/Browser/TakeQuizTest.php to the new selector (ARCH-009)"
    depends_on: [P5-T3]
    use_cases: [UC-024]
    decisions: [ARCH-009]
    acceptance_criteria:
      - "Given a published live quiz, When its owning teacher opens the activity page, Then it shows 'Open live quiz' linking to the monitor and no self-paced 'Open quiz' link"
      - "Given a published live quiz, When another teacher of the organisation opens the activity page, Then no 'Open live quiz' link is shown"
      - "Given a published self-paced quiz, When an enrolled student opens the activity page, Then it shows the self-paced 'Open quiz' link (activity action open_quiz); When its owning teacher opens it, Then no 'Open live quiz' link is shown"
    touches: {writes: [CMP-Live, CMP-Activities]}
  - id: P5-T5
    title: Student player UI (mobile-first)
    description: "Player page; LiveQuizType's activity page action 'Join live quiz' for enrolled students (ARCH-009, contract added by P5-T4)"
    depends_on: [P5-T3, P5-T4]
    use_cases: [UC-025]
    decisions: [ARCH-009]
    acceptance_criteria:
      - "Given a published live quiz, When an enrolled student opens the activity page, Then it shows 'Join live quiz' linking to the player and no self-paced 'Open quiz' link"
    touches: {writes: [CMP-Live, CMP-Activities]}
  - id: P5-T6
    title: Live quiz load browser test
    depends_on: [P5-T4, P5-T5]
    touches: {writes: [CMP-Live]}
