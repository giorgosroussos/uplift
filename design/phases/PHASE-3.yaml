id: PHASE-3
goal: "Activities framework and self-paced quizzes end to end: wizard, question bank, taking, grading, results"
depends_on: [PHASE-2]
use_cases: [UC-022, UC-023, UC-012, UC-026, UC-017, UC-028, UC-030]
entities: [ENT-Activity, ENT-Quiz, ENT-Question, ENT-ChoiceOption, ENT-MatchingPair, ENT-QuizQuestion, ENT-QuizAttempt, ENT-Answer, ENT-AnswerSelection, ENT-AnswerMatch]
components: [CMP-Activities, CMP-Assessment, CMP-Notifications]
decisions: [ARCH-004, DATA-003, DATA-004, DATA-005, DATA-008, DATA-016, SCOPE-008, SCOPE-009, SCOPE-023, SCOPE-016, SCOPE-024]
environment: development
out_of_scope:
  - "Polls, topics, slots, groups and group attempts (PHASE-4)"
  - "Live quizzes; the wizard offers only self-paced mode (PHASE-5)"
  - "XP, badges, leaderboards (PHASE-6)"
  - "Analytics and dashboards (PHASE-7)"
tasks:
  - id: P3-T1
    title: Activity base, ActivityType contract and wizard shell
    description: "Activity model and lifecycle (draft, published, closed); ActivityType contract that modules register; multi-step wizard with autosave; submissions overview fed by each type"
    touches: {writes: [CMP-Activities], reads: [CMP-Courses], migrations: true}
  - id: P3-T2
    title: Personal question bank
    description: "Question model with the five types, validation per DATA-016, builder UI including matching pairs and drag-and-drop ordering of options and pairs; bank pages for teachers only (OWN-016). Scope is ENT-Question, ENT-ChoiceOption and ENT-MatchingPair only: the OWN-006 and OWN-007 criteria and the state-model criteria of ENT-QuizAttempt and ENT-Answer that appear in this brief belong to P3-T4 and P3-T5 and are NOT verified here"
    use_cases: [UC-023]
    entities: [ENT-Question, ENT-ChoiceOption, ENT-MatchingPair]
    touches: {writes: [CMP-Assessment], migrations: true}
  - id: P3-T3
    title: Quiz activity type
    description: "Quiz subtype registered through ActivityType; quiz settings in the wizard; adding questions by copying from the bank; ordering"
    depends_on: [P3-T1, P3-T2]
    use_cases: [UC-022]
    acceptance_criteria:
      - "Given a bank question copied into a quiz, When the teacher edits or deletes the bank question, Then the quiz copy is unchanged"
    touches: {writes: [CMP-Assessment], reads: [CMP-Activities], migrations: true}
  - id: P3-T4
    title: Take a self-paced quiz
    description: "Attempts, server-side time limit, autosaved answers, auto-submit, auto-grading with partial credit and optional negative marking, per SCOPE-024. CloseActivity dispatches App\\Modules\\Activities\\Events\\ActivityClosed(organizationId, activityId) after commit; an Assessment listener auto-submits that quiz's in-progress attempts; a scheduled job auto-submits attempts past ends_at"
    depends_on: [P3-T3]
    use_cases: [UC-012]
    touches: {writes: [CMP-Assessment, CMP-Activities], migrations: true}
  - id: P3-T5
    title: Grading, results and quiz submissions
    description: "Free-text grading with feedback, provisional vs final scores, grading-scale conversion and rounding, My results, quiz submissions in the overview; GradeFinalised event"
    depends_on: [P3-T4]
    use_cases: [UC-026, UC-017, UC-028]
    touches: {writes: [CMP-Assessment], reads: [CMP-Activities, CMP-Tenancy]}
  - id: P3-T6
    title: CSV question import
    depends_on: [P3-T2]
    use_cases: [UC-030]
    touches: {writes: [CMP-Assessment]}
  - id: P3-T7
    title: Notifications for new activities and grades
    description: "activity_published and grade notifications. Grade notifications follow DEC-003: Assessment gains ENT-QuizAttempt.result_released_at, the ResultReleased and ResultChanged events and an every-minute release command; Notifications listen to those events instead of GradeFinalised and add the grade_changed kind"
    depends_on: [P3-T1, P3-T5]
    entities: [ENT-QuizAttempt]
    acceptance_criteria:
      - "Given a fully auto-graded attempt of a quiz with score_visibility immediate, When submitted, Then the student gets one grade_finalised in-app entry and one queued email at once"
      - "Given score_visibility after_deadline and a deadline in 1 hour, When an auto-graded attempt is submitted, Then no notification exists; When the deadline passes and the release command runs, Then the student gets one in-app entry and one email"
      - "Given score_visibility after_deadline and no deadline, When an auto-graded attempt is submitted, Then the student is notified at once"
      - "Given score_visibility after_deadline and a passed deadline, When the last free-text answer is graded, Then the student is notified at once"
      - "Given an attempt with a pending free-text answer, When the deadline passes, Then nothing is sent; When the answer is graded, Then the student is notified once"
      - "Given score_visibility hidden, When an attempt becomes final and the deadline passes, Then no grade notification is sent; When the teacher changes visibility to immediate, Then the next release command notifies the student once"
      - "Given a released attempt, When the release command runs again or the attempt is finalised again, Then no second grade_finalised notification is sent"
      - "Given a released attempt, When the teacher regrades an answer and earned_points changes, Then the student gets one grade_changed in-app entry and email; When a regrade leaves earned_points unchanged, Then nothing is sent"
      - "Given an unreleased attempt, When the teacher regrades an answer, Then nothing is sent before the release"
      - "Given a deadline moved later before it passed, When the old deadline passes, Then nothing is sent; When the new one passes, Then the students are notified"
    touches: {writes: [CMP-Notifications, CMP-Assessment], reads: [CMP-Activities], migrations: true}
