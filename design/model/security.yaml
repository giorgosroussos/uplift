# Roles from actors, permissions from use cases; ownership rules limit
# records WITHIN a permitted use case. Proposed by the assistant, confirmed by the engineer.
roles:
  - {id: ROLE-Guest, from_actor: ACT-Visitor, permissions: [UC-001, UC-002], source: inferred, confirmed: true}
  - id: ROLE-Student
    from_actor: ACT-Student
    permissions: [UC-003, UC-004, UC-005, UC-006, UC-007, UC-008, UC-010, UC-011, UC-012, UC-013, UC-014, UC-015, UC-016, UC-017, UC-018, UC-019, UC-025, UC-039]
    mfa: none
    source: inferred
    confirmed: true
  - id: ROLE-Teacher
    from_actor: ACT-Teacher
    permissions: [UC-003, UC-004, UC-005, UC-006, UC-007, UC-008, UC-020, UC-021, UC-022, UC-023, UC-024, UC-026, UC-027, UC-028, UC-029, UC-030, UC-039]
    mfa: none
    source: inferred
    confirmed: true
  - id: ROLE-OrgAdmin
    from_actor: ACT-OrgAdmin
    permissions: [UC-003, UC-004, UC-006, UC-007, UC-021, UC-031, UC-032, UC-033, UC-034, UC-039]
    mfa: optional
    source: inferred
    confirmed: true
  - {id: ROLE-PlatformAdmin, from_actor: ACT-SuperAdmin, permissions: [UC-035, UC-036], mfa: required, source: inferred, confirmed: true}
  - {id: ROLE-System, from_actor: ACT-Scheduler, permissions: [UC-037, UC-038], source: inferred, confirmed: true}

ownership:
  - {id: OWN-001, entity: ENT-User, rule: "A student or teacher reads and edits only their own user record; an org admin manages only users of their own organisation", applies_to: [ROLE-Student, ROLE-Teacher, ROLE-OrgAdmin], source: inferred, confirmed: true}
  - {id: OWN-002, entity: ENT-Invitation, rule: "An org admin sees and revokes only invitations of their own organisation", applies_to: [ROLE-OrgAdmin], source: inferred, confirmed: true}
  - {id: OWN-003, entity: ENT-Enrolment, rule: "A student sees only their own enrolments; a teacher sees enrolments only of course spaces they own", applies_to: [ROLE-Student, ROLE-Teacher], source: inferred, confirmed: true}
  - {id: OWN-004, entity: ENT-CourseSpace, rule: "A teacher edits only course spaces they own; an org admin may view but not edit course spaces of their organisation", applies_to: [ROLE-Teacher, ROLE-OrgAdmin], source: inferred, confirmed: true}
  - {id: OWN-005, entity: ENT-GroupMembership, rule: "A student sees memberships only of groups they belong to or are invited to; a teacher sees groups only of course spaces they own", applies_to: [ROLE-Student, ROLE-Teacher], source: inferred, confirmed: true}
  - {id: OWN-006, entity: ENT-QuizAttempt, rule: "A student reads only their own attempts or attempts of their group; a teacher reads only attempts of quizzes in course spaces they own; an org admin never reads individual attempts, only aggregates (SEC-007)", applies_to: [ROLE-Student, ROLE-Teacher, ROLE-OrgAdmin], source: inferred, confirmed: true}
  - {id: OWN-007, entity: ENT-Answer, rule: "A student reads only answers of their own or their group's attempts; a teacher grades only answers of quizzes in course spaces they own; an org admin never reads individual answers (SEC-007)", applies_to: [ROLE-Student, ROLE-Teacher, ROLE-OrgAdmin], source: inferred, confirmed: true}
  - {id: OWN-008, entity: ENT-TopicChoice, rule: "A student changes only their own or their group's topic choice; a teacher sees choices only of their own activities", applies_to: [ROLE-Student, ROLE-Teacher], source: inferred, confirmed: true}
  - {id: OWN-009, entity: ENT-TopicProposal, rule: "A student reads only their own or their group's proposals; a teacher decides only proposals of their own activities", applies_to: [ROLE-Student, ROLE-Teacher], source: inferred, confirmed: true}
  - {id: OWN-010, entity: ENT-Booking, rule: "A student changes only their own or their group's booking; a teacher sees bookings only of their own activities", applies_to: [ROLE-Student, ROLE-Teacher], source: inferred, confirmed: true}
  - {id: OWN-011, entity: ENT-PollParticipation, rule: "A student sees only their own participation; a teacher sees only vote counts per option and the number of participants, never who voted or what anyone voted", applies_to: [ROLE-Student, ROLE-Teacher], source: inferred, confirmed: true}
  - {id: OWN-012, entity: ENT-LiveParticipant, rule: "A student sees only their own progress and score, plus the final ranking (nicknames only, SEC-008) when enabled; the host teacher sees all participants of their session", applies_to: [ROLE-Student, ROLE-Teacher], source: inferred, confirmed: true}
  - {id: OWN-013, entity: ENT-LiveAnswer, rule: "A student sees only their own live answers; during the session the host teacher sees only how many questions each participant has answered, after it finishes the scores and answer distributions of their own session", applies_to: [ROLE-Student, ROLE-Teacher], source: inferred, confirmed: true}
  - {id: OWN-014, entity: ENT-XpEvent, rule: "A student sees only their own XP events; others see only totals on leaderboards when enabled", applies_to: [ROLE-Student], source: inferred, confirmed: true}
  - {id: OWN-015, entity: ENT-UserBadge, rule: "A student sees only their own badges", applies_to: [ROLE-Student], source: inferred, confirmed: true}
  - {id: OWN-016, entity: ENT-Question, rule: "A teacher reads, edits and deletes only their own bank questions (in_bank = true, owner_id = self); org admins and students have no access to any question bank (DATA-008)", applies_to: [ROLE-Teacher, ROLE-OrgAdmin, ROLE-Student], source: inferred, confirmed: true}
